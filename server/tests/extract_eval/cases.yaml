# 세션 종료 추출 평가 세트(계획서 S2-09). 걸으며 나눈 대화 전문과 사람이 정한 정답(아이디어·할 일).
# 정답 기준: 사용자가 말했거나 받아들인 것만(말한 그대로, 조건을 덧붙이지 않는다). 캐릭터가 제안했지만 사용자가 받아들이지 않은 것은 넣지 않는다.
# role: user | assistant (assistant 화자 이름은 실행할 때 페르소나 YAML에서 붙인다)
cases:
  - id: trash-map
    note: 기본 브레인스토밍. 아이디어 2개, 할 일 1개
    turns:
      - [assistant, "다니엘님, 안녕하세요! 오늘은 무슨 생각 하면서 걸을까요?"]
      - [user, "등산하는데 쓰레기통이 하나도 없더라. 등산로 쓰레기통 위치를 지도로 모아 보면 어떨까 싶어."]
      - [assistant, "오, 완전 좋은데요?! 그거 제일 먼저 쓸 사람은 누구일까요?"]
      - [user, "주말에 산 타는 사람들이지. 아 그리고 쓰레기통이 꽉 찼는지 사람들이 제보하는 기능도 있으면 좋겠다."]
      - [assistant, "제보 기능까지! 대박이에요. 그럼 첫 단계로 뭘 해 보면 좋을까요?"]
      - [user, "일단 공공데이터 포털에 쓰레기통 위치 데이터가 있는지 찾아봐야겠어."]
      - [assistant, "좋아요! 데이터부터 확인하는 거 딱이에요."]
    gold:
      ideas:
        - 등산로 쓰레기통 위치를 모은 지도
        - 쓰레기통이 꽉 찼는지 사용자가 제보하는 기능
      todos:
        - 공공데이터 포털에서 쓰레기통 위치 데이터 찾아보기

  - id: rejected-suggestion
    note: 캐릭터 제안을 사용자가 거절. 거절한 것은 정답이 아니다
    turns:
      - [assistant, "다니엘님, 좋은 아침이에요! 오늘은 어떤 이야기 할까요?"]
      - [user, "동네 빵집들 갓 나온 빵 시간을 알려 주는 알림 서비스를 생각해 봤어."]
      - [assistant, "오 그거 너무 좋아요! 이거 로봇이랑 붙여서 빵 배달까지 하면 어때요?"]
      - [user, "아니 배달은 너무 커. 그건 빼자. 빵 나오는 시간만 알려 주는 걸로."]
      - [assistant, "알겠어요, 깔끔하게 알림만! 빵집 사장님들은 어떻게 참여하게 할까요?"]
      - [user, "사장님이 버튼 하나만 누르면 알림이 가게 하면 될 것 같아. 이번 주에 단골 빵집 사장님한테 물어봐야지."]
    gold:
      ideas:
        - 동네 빵집의 갓 나온 빵 시간을 알려 주는 알림 서비스
        - 빵집 사장님이 버튼 하나로 알림을 보내는 방식
      todos:
        - 이번 주에 단골 빵집 사장님에게 의견 물어보기

  - id: small-talk
    note: 아이디어·할 일이 없는 대화
    turns:
      - [assistant, "다니엘님, 오늘 날씨 어때요?"]
      - [user, "바람이 좀 불어서 시원해. 그냥 걷는 중이야."]
      - [assistant, "시원한 바람 완전 좋죠! 어디로 걷고 계세요?"]
      - [user, "한강 따라서. 오늘은 별생각 없이 걷고 싶어."]
      - [assistant, "그럼 오늘은 편하게 걸어요! 저는 옆에서 맞장구만 칠게요."]
    gold:
      ideas: []
      todos: []

  - id: todos-with-time
    note: 시간이 들어간 할 일 여러 개. 숫자를 지켜야 한다
    turns:
      - [assistant, "다니엘님, 오늘 뭐 정리할 거 있어요?"]
      - [user, "오늘 할 게 좀 많아. 3시에 치과 예약 확인 전화해야 하고."]
      - [assistant, "치과 전화, 3시! 또 있어요?"]
      - [user, "저녁 7시까지 팀 발표 자료 초안을 보내야 해. 그리고 내일 아침에 우유 2개 사기."]
      - [assistant, "세 가지네요! 다 기억해 둘게요."]
    gold:
      ideas: []
      todos:
        - 3시에 치과에 예약 확인 전화하기
        - 저녁 7시까지 팀 발표 자료 초안 보내기
        - 내일 아침에 우유 2개 사기

  - id: web-search
    note: 웹 검색 결과가 섞인 대화. 검색 결과 속 정보는 아이디어가 아니다
    turns:
      - [assistant, "다니엘님, 오늘은 무슨 생각 하세요?"]
      - [user, "요즘 러닝 크루가 유행이라던데 진짜야?"]
      - [assistant, "잠깐 찾아볼게요. 검색해 보니 2030 사이에서 러닝 크루가 많이 늘었다고 해요. 출처는 한 일간지예요."]
      - [user, "그럼 회사 사람들끼리 점심 러닝 모임을 만들어 보면 재밌겠다."]
      - [assistant, "점심 러닝 모임 완전 좋은데요?! 몇 명이랑 시작해 볼까요?"]
      - [user, "일단 옆 팀 민지한테 같이 하자고 말해 볼게."]
    gold:
      ideas:
        - 회사 사람들끼리 점심 러닝 모임 만들기
      todos:
        - 옆 팀 민지에게 점심 러닝 모임 같이 하자고 말하기

  - id: idea-evolution
    note: 아이디어가 발전한다. 발전한 최종 아이디어 하나와 할 일
    turns:
      - [assistant, "다니엘님, 오늘은 어떤 이야기 할까요?"]
      - [user, "식물 물 주는 걸 자꾸 까먹어. 물 줄 때 알려 주는 앱 어때?"]
      - [assistant, "좋아요! 비슷한 걸 본 적 있으세요?"]
      - [user, "있긴 한데 다 귀찮아. 아예 화분에 꽂는 습도 센서랑 연결해서 마를 때만 알려 주면 좋겠다."]
      - [assistant, "센서 연결이라니 대박! 그럼 첫 할 일은 뭐가 좋을까요?"]
      - [user, "아두이노 습도 센서 가격부터 알아볼래. 그리고 주말에 베란다 화분 개수 세 보기."]
    gold:
      ideas:
        # 처음 말한 "물 줄 때 알려 주는 앱"을 센서 방식으로 발전시켰다. 하나로 본다
        - 화분 습도 센서와 연결해 흙이 마를 때만 물 줄 때를 알려 주는 앱
      todos:
        - 아두이노 습도 센서 가격 알아보기
        - 주말에 베란다 화분 개수 세 보기

  - id: negation
    note: 하지 않기로 한 일. 부정을 뒤집으면 안 된다
    turns:
      - [assistant, "다니엘님, 오늘 계획 있어요?"]
      - [user, "원래 이번 주말에 등산 가려고 했는데 안 가기로 했어. 비 온대."]
      - [assistant, "아쉽네요! 그럼 주말엔 뭐 하실 거예요?"]
      - [user, "집에서 밀린 블로그 글 하나 쓰려고. 주제는 지난달 다녀온 지리산 후기."]
      - [assistant, "지리산 후기 완전 기대돼요!"]
      - [user, "아 그리고 블로그에 등산 장비 리뷰 시리즈를 연재해 보면 어떨까 생각 중이야."]
    gold:
      ideas:
        - 블로그에 등산 장비 리뷰 시리즈 연재하기
      todos:
        - 이번 주말에 지리산 후기 블로그 글 쓰기

  - id: long-brainstorm
    note: 아이디어가 많은 긴 대화
    turns:
      - [assistant, "다니엘님, 오늘은 무슨 생각 하면서 걸을까요?"]
      - [user, "산책 앱을 만들고 싶어. 걸으면서 음성으로 메모하는 거."]
      - [assistant, "오 완전 좋아요! 누가 쓰면 좋을까요?"]
      - [user, "아이디어 많은 직장인들. 그리고 메모를 걸은 경로 지도 위에 핀으로 꽂아 주면 좋겠어."]
      - [assistant, "경로 위 메모 핀이라니 대박이에요! 또 있어요?"]
      - [user, "주간 요약을 금요일 저녁에 음성으로 들려주는 것도. 아 그리고 친구랑 같은 산책길 메모를 공유하는 기능."]
      - [assistant, "공유까지! 그중에 제일 끌리는 건 뭐예요?"]
      - [user, "경로 지도 핀이 제일 좋아. 이번 주에 지도 API 무료 사용량부터 비교해 볼게."]
      - [assistant, "좋아요, 지도 API 비교부터!"]
    gold:
      ideas:
        - 걸으면서 음성으로 메모하는 산책 앱
        - 메모를 걸은 경로 지도 위에 핀으로 표시
        - 금요일 저녁에 주간 요약을 음성으로 들려주기
        - 친구와 같은 산책길 메모를 공유하는 기능
      todos:
        - 이번 주에 지도 API 무료 사용량 비교하기

  - id: interrupted
    note: 답변이 중간에 끊긴 대화(말이 끊김 표시)
    turns:
      - [assistant, "다니엘님, 반가워요! 오늘은 뭐 할까요?"]
      - [user, "아이들 용돈 관리 앱 생각해 봤어. 저금하면 캐릭터가 자라는 거."]
      - [assistant, "와 캐릭터가 자라는 거 완전 귀엽…"]
      - [user, "잠깐, 그리고 부모가 미션을 주면 용돈을 주는 기능도."]
      - [assistant, "미션 용돈 좋아요! 그럼 처음엔 뭘 해 볼까요?"]
      - [user, "조카한테 어떤 캐릭터가 좋은지 물어볼게."]
    interrupted: [2]
    gold:
      ideas:
        - 저금하면 캐릭터가 자라는 아이 용돈 관리 앱
        - 부모가 미션을 주면 용돈을 주는 기능
      todos:
        - 조카에게 어떤 캐릭터가 좋은지 물어보기

  - id: memo-vs-todo
    note: 기억할 정보(메모)와 할 일이 섞임. 메모는 아이디어·할 일 정답에 넣지 않는다
    turns:
      - [assistant, "다니엘님, 오늘 걷기 어때요?"]
      - [user, "좋아. 아 참, 동네 도서관이 다음 달부터 월요일 휴관이래."]
      - [assistant, "오 그거 기억해 둘 만하네요!"]
      - [user, "응. 그래서 빌린 책은 이번 일요일까지 반납해야겠다."]
      - [assistant, "일요일 반납, 꼭 기억해요!"]
      - [user, "그리고 도서관 빈자리를 알려 주는 알림이 있으면 좋겠다는 생각이 들었어."]
    gold:
      ideas:
        - 도서관 빈자리를 알려 주는 알림
      todos:
        - 빌린 책을 이번 일요일까지 반납하기
